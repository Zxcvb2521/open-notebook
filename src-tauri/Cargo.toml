[package]
name = "open-notebook"
version = "1.13.0"
description = "Open Notebook - AI Research Assistant"
authors = ["Zed"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "open_notebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

# Serialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Database (SQLite)
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client (for AI APIs)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Encryption (AES-256-GCM)
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# Password hashing
argon2 = "0.5"

# Logging
log = "0.4"

# Python subprocess management
which = "7"

# File type detection
mime_guess = "2"

# Multipart form data for file uploads (reqwest has built-in support)

# Streaming
futures = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
